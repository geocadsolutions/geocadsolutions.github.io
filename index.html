.hx-glow{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 20% 30%,#16a34a 0%,transparent 50%),radial-gradient(circle at 80% 70%,#3b82f6 0%,transparent 50%)}
.hx-wrap{position:relative;max-width:1120px;margin:0 auto;padding:64px 20px;display:grid;gap:40px;align-items:center}
.hx-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:9999px;padding:4px 12px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#86efac;margin-bottom:20px}
.hx-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:hxpulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes hxpulse{0%,100%{opacity:1}50%{opacity:.4}}
.hx-h1{font-weight:900;letter-spacing:-.03em;line-height:.95;font-size:32px}
.hx-accent{color:#3ee07f}
.hx-sub{color:rgba(255,255,255,.7);font-size:16px;line-height:1.6;margin-top:20px;max-width:560px}
.hx-chip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;background:rgba(22,163,74,.15);border:1px solid rgba(22,163,74,.2);border-radius:9999px;padding:6px 14px;font-size:12px;font-weight:500;color:#bbf7d0;line-height:1.25;margin-top:16px;max-width:100%}
.hx-chipdot{width:6px;height:6px;border-radius:50%;background:#3ee07f;flex-shrink:0}
.hx-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hx-btn{height:48px;padding:0 26px;border-radius:9999px;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:background .2s}
.hx-btn-green{background:#16a34a;color:#fff;font-weight:700;box-shadow:0 10px 24px rgba(6,40,20,.35)}
.hx-btn-green:hover{background:#15803d}
.hx-btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:600}
.hx-btn-ghost:hover{background:rgba(255,255,255,.18)}
.hx-btn-white{background:#fff;color:#0a1e3c;font-weight:700}
.hx-btn-white:hover{background:#e2e8f0}
.hx-social{display:flex;align-items:center;gap:24px;margin-top:40px;flex-wrap:wrap}
.hx-avatars{display:flex}
.hx-avatar{width:32px;height:32px;border-radius:50%;border:2px solid #0a1e3c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.hx-avatar+.hx-avatar{margin-left:-8px}
.hx-social-txt{font-size:13px;line-height:1.15}
.hx-pay{display:none;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.45);border-left:1px solid rgba(255,255,255,.12);padding-left:24px}
@media(min-width:640px){.hx-pay{display:flex}}
.hx-video-card{position:relative}
.hx-frame{border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:8px;box-shadow:0 25px 60px -12px rgba(0,0,0,.55)}
.hx-screen{border-radius:14px;overflow:hidden;background:#000;position:relative;aspect-ratio:16/9}
.hx-live{position:absolute;top:12px;left:12px;background:#16a34a;color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:9999px;pointer-events:none;z-index:2}
.hx-caption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 6px;font-size:13px;color:rgba(255,255,255,.8)}
.hx-caption small{font-size:11px;color:rgba(255,255,255,.4);white-space:nowrap}
.hx-float{position:absolute;bottom:-24px;left:-16px;background:#fff;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.25);border:1px solid #f1f5f9;padding:16px;width:240px;display:none;flex-direction:column;gap:8px}
.hx-float-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#0a1e3c}
.hx-float-n{font-size:28px;font-weight:900;line-height:1;color:#0a1e3c}
.hx-float-n span{font-size:14px;font-weight:600;color:#64748b}
.hx-float-d{font-size:11px;color:#64748b}
@media(min-width:1024px){.hx-wrap{grid-template-columns:1.1fr .9fr;gap:56px;padding:88px 32px}.hx-h1{font-size:46px}.hx-float{display:flex;left:-32px}}
